<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check code</title>
</head>
<body>
  <img src="../../../assets/logo2.png" class="logo" id="poza">
  <div class="container">
    <h1>Check code</h1>
    <form (ngSubmit)="onSubmit(email.value,code.value)">
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required #email>
      </div>
      <div class="form-group">
        <label for="code">Code:</label>
        <input type="text" id="code" name="code" required #code>
      </div>
      <div class="form-group">
        <button type="submit">Send code</button>
      </div>
    </form>
  </div>
</body>
</html>
