<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recovery account</title>
</head>
<body>
  <img src="../../../assets/logo2.png" class="logo" id="poza">
  <div class="container">
    <h1>Recovery account</h1>
    <form (ngSubmit)="onSubmit(email.value)" #recoveryForm="ngForm">
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required #email=>
      </div>
      <div class="form-group">
        <button type="submit" >Send code</button>
      </div>
    </form>
  </div>
</body>
</html>
