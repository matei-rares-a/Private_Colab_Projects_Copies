

<div *ngIf="loading" class="custom-loader-container">
  <div class="custom-loader"></div>
  <div class="custom-loading-text">Please wait...</div>
</div>





<body *ngIf="!loading">
  <div class="fat">
    <img [src]="topImageSrc" alt="Imaginea de sus de fundal" />
  </div>
  <div class="title-container">
    <h3>{{ article.title }}</h3>
    <button class="edit editCreator" id="editCreator" *ngIf="isCreatorOfArticle()" (click)="handleEdit()">edit</button>
    <button class="delete deleteCreator" id="deleteCreator" *ngIf="isCreatorOfArticle()" (click)="handleDeleteArticle()">delete</button>

  </div>
  <br />

  <div class="details">
    <label
      >Publication date : {{ formatDate(article.publicateDate,true) }} | Author:
      {{ article.author }}</label
    >
    <br />
  </div>

  <div class="bold_details">
    <label>
      {{ article.categories.join(", ") }} | {{ article.city }} |
      {{ formatDate(article.dateOfTheEvent,false) }}
    </label>
  </div>

  <br />

  <mat-grid-list cols="2" rowHeight="2:1">
    <mat-grid-tile>
      <div class="content">
        <div class="text">
          <label style="white-space: pre-line">
            {{ article.content }}
          </label>
        </div>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <!-- ngFor cu imagini (spatiere intre ele)-->
      <div class="content">
        <div class="images">
          <button class="prev-btn" (click)="prevImage()">&lt;</button>
          <img width="500px" height="300px" style="border-radius: 10px !important ;" [src]="sideImageToShow" alt="imagine de pe lateral" />
          <button class="next-btn" (click)="nextImage()">&gt;</button>
        </div>
      </div></mat-grid-tile
    >
  </mat-grid-list>

  <!-- <div class="image-slider">
    <button class="prev-btn" onclick="prevImage()">Previous</button>
    <img class="slider-image" src="imagine1.jpg" alt="Image 1" />
    <button class="next-btn" onclick="nextImage()">Next</button>
  </div> -->

  <br />

<!-- Input de comentariu -->

    <!-- *ngIf="isLoggedIn" -->
    <div class="container" *ngIf="isUserLogged()">
      <div class="input-comment">
        <!-- element pentru iconita utilizatorului-->
        <span id="user" class="circle">{{getUserFirstLetter(0,true)}}</span>
        <br />
        <input [(ngModel)]="commentText" />
      </div>
      <button class="post" (click)="onPostComment()">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512"><!--! Font Awesome Free 6.4.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2023 Fonticons, Inc. --><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg>
        </div>
        <span>Post</span>
      </button>
    </div>

    <br />
    <br />
    <br />
<!-- MY COMMENTS -->
  <div class="my-comments" *ngIf="isUserLogged()">
      <div *ngFor="let comment of my_comments; let i=index;" class="comment">
        <!--TODO inlocuieste comments cu article.comments-->
        <span id="user" class="circle">{{getUserFirstLetter(comment.id,true)}}</span>
        <span class="name-text">{{comment.authorComment}}</span>
        <input  [disabled]="!isInputDisabledMyComments[i]" [(ngModel)]="comment.content"/>

        <img class="like" [src]="comment.id ? getLikeImage(comment.id) : ''" alt="like" (click)="changeFeedback(comment.id,true)"/>
        <img class="dislike" [src]="comment.id ? getDislikeImage(comment.id) : ''" (click)="changeFeedback(comment.id,false)" />

            </path>
          </svg>
          </div>

          <div class="icon">

            </svg>
            <svg class="bottom">

            </svg>

<!--  COMMENTS -->
    <div class="comments">
      <div *ngFor="let comment of comments; let i = index" class="comment">
        <!--TODO inlocuieste comments cu article.comments-->
        <span id="user" class="circle">{{authorLetters[i]}}</span>
        <span class="name-text">{{comment.authorComment}}</span>

        <input  [disabled]="true" [placeholder]="comment.content"/>


        <img class="like" *ngIf="isUserLogged()" alt="like" [src]="comment.id ? getLikeImage(comment.id) : ''"  (click)="changeFeedback(comment.id,true)" />
        <img class="dislike" *ngIf="isUserLogged()" alt="dislike" [src]="comment.id ? getDislikeImage(comment.id) : ''"  (click)="changeFeedback(comment.id,false)" />
