<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pagina cu Cards</title>
</head>


<div *ngIf="loading" class="custom-loader-container">
  <div class="custom-loader"></div>
  <div class="custom-loading-text">Please wait...</div>
</div>





<body *ngIf="!loading">
  <h1>InnerGlow Team</h1>
  <div class="cards-container">
  <div *ngFor="let card of getDisplayedCards()" class="card">
    <br>
    <img [src]="card.img" alt="{{ card.id }}">
    <h3 class="Name">{{ card.name }}</h3>
    <p class="description">{{ card.description }}</p>
    <div class="links">
      <a [href]="card.link" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="25" viewBox="0 0 29 32" fill="none">

          <defs>
          <clipPath id="clip0_18_31560">
          <rect width="29" height="32" fill="white"/>
          </clipPath>
          </defs>
          </svg>
      </a>
    </div>
  </div>
  </div>

  <div class="paginator">
    <button id="leftButton" (click)="changePage(1)">&lt;</button>
    <button id="rightButton" (click)="changePage(2)">&gt;</button>
  </div>

</body>
</html>
