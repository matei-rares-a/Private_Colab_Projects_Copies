      <div class="input-magnifier">
        <img src="assets/magnify.png" (click)="handleSubmit()" />
        <input type="text" style="color: black" [(ngModel)]="searchQuery" (keyup.enter)="handleSubmit()" />

  <div class="page-names">
    <a routerLink="/home"  [ngClass]="classToApplyHome">Home</a>
    <a routerLink="/about" [ngClass]="classToApplyAbout">About</a>
    <a routerLink="/contact-us" [ngClass]="classToApplyContact">Contact us</a>
    <a  [ngClass]="classToApplyFavorites" (click)="handleFavoritesClick()">Favorites</a>
    <a routerLink="/blog/articles" [ngClass]="classToApplyBlog">Blogs</a>
  </div>

  <div class="admin">
  <a id="admin"  (click)="handleUser()" class="circle" *ngIf="isLoggedIn">{{getUserFirstLetter()}}</a>
    </div>
    
 <div class="buttons">
    <button
    class="sign-up-button"
    routerLink="/auth/log-in"
    *ngIf="!isLoggedIn"
  >
    <img src="assets/plus-white.png"  />
    Sign in
  </button>

  <button
    class="join-us-button"
    routerLink="/auth/sign-up"
    *ngIf="!isLoggedIn"
  >
    <img src="assets/plus.png"  />
    Join us
  </button> 

  <button
    class="sign-out-button"
    routerLink="/home"
    (click)="handleSignOut()"
    *ngIf="isLoggedIn"
  
    >

    <img src="assets/minus.png"  />
    Sign out
  </button>
